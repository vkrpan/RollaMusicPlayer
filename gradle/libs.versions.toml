[versions]
agp                = "8.5.2"
kotlin             = "2.0.21"
kotlinxSerialization       = "1.7.3"
ksp                = "2.0.21-1.0.27"
compileSdk         = "34"
minSdk             = "24"
targetSdk          = "34"

# Compose
composeBom         = "2024.09.03"
composeCompiler    = "1.5.15"

# AndroidX
coreKtx            = "1.13.1"
lifecycleRuntime   = "2.8.6"
activityCompose    = "1.9.2"
navigationCompose  = "2.8.3"

# Hilt
hilt               = "2.52"
hiltNavigationCompose = "1.2.0"

# Media3
media3             = "1.4.1"

# Room
room               = "2.6.1"

# DataStore
datastore          = "1.1.1"

# Coil
coil               = "2.7.0"

# Glance (widget)
glance             = "1.1.0"

# Coroutines
coroutines         = "1.8.1"

# Static analysis
detekt             = "1.23.6"
spotless           = "6.25.0"

# Testing
junit              = "4.13.2"
junitExt           = "1.2.1"
espresso           = "3.6.1"

[libraries]
# AndroidX core
androidx-core-ktx              = { group = "androidx.core",            name = "core-ktx",                      version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",         version.ref = "lifecycleRuntime" }
androidx-activity-compose      = { group = "androidx.activity",        name = "activity-compose",              version.ref = "activityCompose" }

# Compose BOM + toolkit
androidx-compose-bom           = { group = "androidx.compose",         name = "compose-bom",                   version.ref = "composeBom" }
androidx-compose-foundation    = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui            = { group = "androidx.compose.ui",      name = "ui" }
androidx-compose-ui-graphics   = { group = "androidx.compose.ui",      name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling    = { group = "androidx.compose.ui",      name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui",   name = "ui-test-manifest" }
androidx-compose-ui-test-junit4   = { group = "androidx.compose.ui",   name = "ui-test-junit4" }
androidx-compose-material3     = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose    = { group = "androidx.navigation",      name = "navigation-compose",            version.ref = "navigationCompose" }

# Lifecycle / ViewModel
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",  version.ref = "lifecycleRuntime" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",    version.ref = "lifecycleRuntime" }

# Hilt
hilt-android                   = { group = "com.google.dagger",        name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",        name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",            name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }

# Media3 / ExoPlayer
media3-exoplayer               = { group = "androidx.media3",          name = "media3-exoplayer",              version.ref = "media3" }
media3-session                 = { group = "androidx.media3",          name = "media3-session",                version.ref = "media3" }
media3-ui                      = { group = "androidx.media3",          name = "media3-ui",                     version.ref = "media3" }

# Room
room-runtime                   = { group = "androidx.room",            name = "room-runtime",                  version.ref = "room" }
room-ktx                       = { group = "androidx.room",            name = "room-ktx",                      version.ref = "room" }
room-compiler                  = { group = "androidx.room",            name = "room-compiler",                 version.ref = "room" }
room-gradle-plugin             = { group = "androidx.room",            name = "room-gradle-plugin",            version.ref = "room" }
room-testing                   = { group = "androidx.room",            name = "room-testing",                  version.ref = "room" }

# DataStore
datastore-preferences          = { group = "androidx.datastore",       name = "datastore-preferences",         version.ref = "datastore" }

# Coil
coil-compose                   = { group = "io.coil-kt",               name = "coil-compose",                  version.ref = "coil" }

# Glance
glance-appwidget               = { group = "androidx.glance",          name = "glance-appwidget",              version.ref = "glance" }
glance-material3               = { group = "androidx.glance",          name = "glance-material3",              version.ref = "glance" }

# Coroutines
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android",    version.ref = "coroutines" }
kotlinx-coroutines-test        = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test",       version.ref = "coroutines" }
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx",   name = "kotlinx-serialization-json",    version.ref = "kotlinxSerialization" }

# Testing
junit                          = { group = "junit",                    name = "junit",                         version.ref = "junit" }
androidx-junit                 = { group = "androidx.test.ext",        name = "junit",                         version.ref = "junitExt" }
androidx-espresso-core         = { group = "androidx.test.espresso",   name = "espresso-core",                 version.ref = "espresso" }

[plugins]
android-application            = { id = "com.android.application",     version.ref = "agp" }
android-library                = { id = "com.android.library",         version.ref = "agp" }
kotlin-android                 = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm                     = { id = "org.jetbrains.kotlin.jvm",    version.ref = "kotlin" }
kotlin-compose                 = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization           = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                           = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                            = { id = "com.google.devtools.ksp",     version.ref = "ksp" }
room                           = { id = "androidx.room",               version.ref = "room" }
detekt                         = { id = "io.gitlab.arturbosch.detekt",  version.ref = "detekt" }
spotless                       = { id = "com.diffplug.spotless",        version.ref = "spotless" }
